# dsh-genspark — bundle patch layer
#
# This file makes the package treated as a standard profile bundle:
#   dsh plugin --profile <p> add dsh-genspark
# installs and mounts it, so cordis.patch.yml does not need to be edited by hand.
#
# The row id must match the package name (the same as the cordis `name` exported by index.js).
- insert:
    - id: dsh-genspark
      name: 'dsh-genspark'
      config:
        enabled: true
        # Operations with side effects are "not executed unless approved". After the user's approval,
        # run genspark_run with approve_write: true.
        writeMode: approve
        timeoutMs: 600000
        maxOutputChars: 100000
        catalogTtlMs: 900000
        # Runtime for the child process (absolute path to node.exe). If empty, it is searched automatically.
        # Because DSH runs on Electron, specify it explicitly only in environments where the search fails.
        nodePath: ''
        # Categories registered as typed tools.
        #   search … search and research (6 tools)
        #   media  … generated media (4 tools)
        #   social … social media (X / Instagram / Reddit search — 3 tools)
        # An empty array leaves only genspark_run / genspark_tools / genspark_status.
        promotedCategories:
          - search
          - media
          - social
        # List Genspark commands in the composer's `+` menu / `/`.
        # The commands themselves do not create model messages (results are drawn outside the model history).
        # Which commands appear follows promotedCategories (genspark / genspark-tools / genspark-run are always present).
        commands: true
        # Pass the execution result to the agent's next turn so the AI can answer the key points and interpretation in chat.
        # This handoff exists so the AI does not simply repeat what appeared in the command pane (it consumes tokens).
        # Setting it to false makes results appear only in the command pane, as before, without consuming model history.
        commandFollowup: true
        # Upper bound for waiting for command completion (milliseconds). The host freezes the input field until the command finishes
        # (phase = submitting / measured: image generation takes 8 seconds), so this duration lets the command complete first and
        # delivers the result to chat via the handoff above. Generation and analysis tools prioritize the acknowledgment message and
        # return within 150 ms regardless of this value. Setting it to 0 or less waits for completion as before.
        commandInlineWaitMs: 2500
        debug: false
